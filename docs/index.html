<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام إدارة مخزون ومبيعات البركة الذكي</title>
</head>
<body>
  <p id="status">جارٍ تحميل التطبيق...</p>
  <script>
    fetch('https://raw.githubusercontent.com/ZIAD-HANY863/-/main/index.html')
      .then(response => {
        if (!response.ok) throw new Error('تعذر تحميل ملف التطبيق.');
        return response.text();
      })
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(error => {
        document.getElementById('status').textContent = error.message;
      });
  </script>
</body>
</html>
